name: release

# v* 태그를 push하면 테스트 → 빌드 → PyPI 배포까지 자동 진행된다.
# PyPI 인증은 Trusted Publishing(OIDC) — 저장된 API 토큰이 없어도 되므로
# 리포 write 권한이 있는 팀원 누구나 태그만 밀면 릴리스할 수 있다.
#
#   1) pyproject.toml 버전 상향 → main 머지
#   2) git tag v0.19.0 && git push origin v0.19.0
#
# 배포는 GitHub Environment `pypi`를 거치므로, 승인자를 지정해두면
# 승인 전까지 PyPI로 나가지 않는다.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  verify:
    name: verify (버전 일치 + 테스트)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 태그와 pyproject.toml 버전 일치 확인
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG / pyproject=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::태그($TAG)와 pyproject.toml 버전($VER)이 다릅니다. 버전을 맞춘 뒤 태그를 다시 만드세요."
            exit 1
          fi

      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -q

  build:
    name: build wheel + sdist
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build
        run: python -m build

      - name: Verify metadata
        run: twine check dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/document-adapter
    permissions:
      id-token: write   # Trusted Publishing(OIDC)에 필수
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true   # 이미 올라간 버전이면 실패 대신 건너뜀

  github-release:
    name: create GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
